<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トレ記録">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F161D" media="(prefers-color-scheme: dark)">
<title>トレ記録</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#EDF0F3; --panel:#FFFFFF; --soft:#F3F5F8; --ink:#16202B; --muted:#5B6B7B; --line:#D3DAE1;
  --str:#2447D6; --car:#0B8F80; --meal:#B86E00; --pr:#9A6B00; --danger:#B83232; --on:#FFFFFF;
  --good:#0B7F5B; --good-bg:#DDF3EA; --ok:#8A5A00; --ok-bg:#FBEBD0; --bad:#B83232; --bad-bg:#F9DEDE;
  --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --numfont:"Bahnschrift","DIN Alternate","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F161D; --panel:#18222C; --soft:#1F2B36; --ink:#E7EDF3; --muted:#93A3B3; --line:#2B3946;
    --str:#8AA2FF; --car:#3CCDB9; --meal:#F0A93B; --pr:#E8C15A; --danger:#FF8585; --on:#0F161D;
    --good:#5FDDB0; --good-bg:#12352B; --ok:#F0C46A; --ok-bg:#3A2D10; --bad:#FF9A9A; --bad-bg:#3D1C1C;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:0 12px calc(86px + var(--sa-b))}
.num{font-family:var(--numfont);font-variant-numeric:tabular-nums;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.grow{flex:1}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--str);outline-offset:2px}

/* ヘッダー（日付） */
.top{position:sticky;top:0;z-index:8;background:var(--bg);padding:calc(8px + var(--sa-t)) 0 8px;display:flex;align-items:center;gap:6px}
.dlabel{position:relative;flex:1;text-align:center;font-size:18px;font-weight:800;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.dlabel input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.nb{min-width:44px;min-height:44px;font:inherit;font-size:22px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer}
.todaybtn{min-height:44px;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:0 10px;cursor:pointer}

/* ボタン類 */
.btn{font:inherit;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 14px;min-height:44px;border-radius:8px}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px;color:var(--muted)}
.btn.go{color:var(--on);border-color:transparent;font-weight:700}
.str .btn.go{background:var(--str)} .car .btn.go{background:var(--car)} .meal .btn.go{background:var(--meal)}
.btn.go.plain{background:var(--ink)}
.btn.wide{width:100%}
.btn.danger{color:var(--danger);border-color:var(--danger)}

/* 下部タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sa-b)}
.tab{font:inherit;font-size:12px;font-weight:700;cursor:pointer;min-height:54px;border:0;border-top:3px solid transparent;background:none;color:var(--muted)}
.tab .tl{display:block;font-size:14px;margin-top:2px}
.tab.on{color:var(--ink)}
.tab[data-t=summary].on,.tab[data-t=settings].on{border-top-color:var(--ink)}
.tab[data-t=strength].on{border-top-color:var(--str)}
.tab[data-t=cardio].on{border-top-color:var(--car)}
.tab[data-t=meal].on{border-top-color:var(--meal)}

/* パネル */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.panel.str{border-left:5px solid var(--str)} .panel.car{border-left:5px solid var(--car)} .panel.meal{border-left:5px solid var(--meal)}
.panel h2{font-size:16px;margin-bottom:8px}
.big{font-size:38px;line-height:1.1}
.unit{font-size:14px;color:var(--muted);margin-left:4px;font-weight:400;font-family:var(--font)}
.str .big,.str .accent{color:var(--str)} .car .big,.car .accent{color:var(--car)} .meal .big,.meal .accent{color:var(--meal)}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;background:var(--c);border-radius:5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);padding:2px 0}
.kv b{color:var(--ink);font-weight:600;text-align:right}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* セグメント */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--muted);min-height:44px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.meal button.on{background:var(--meal);color:var(--on)}

/* フォーム */
.form{margin-top:10px}
.grid2f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4f{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:44px;min-width:0;width:100%}
textarea{padding:8px 10px;min-height:88px;font-size:14px}
.stp{display:flex}
.stp input{text-align:center;border-radius:0;border-left:0;border-right:0;padding:0 2px}
.sb{min-width:44px;min-height:44px;font:inherit;font-size:20px;cursor:pointer;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.sb:first-child{border-radius:8px 0 0 8px}.sb:last-child{border-radius:0 8px 8px 0}
.stack{display:flex;flex-direction:column;gap:10px}

/* 筋トレ */
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0;padding-top:0}
.exh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pr{border:1px solid var(--pr);color:var(--pr);font-weight:700;font-size:12px;padding:0 8px;border-radius:999px}
ol.sets{list-style:none;margin:6px 0 0;padding:0}
ol.sets li{display:grid;grid-template-columns:1.6em 1fr auto 44px;gap:6px;align-items:center;min-height:44px;border-bottom:1px dashed var(--line)}
ol.sets .idx{color:var(--muted);font-family:var(--numfont)}
ol.sets .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:22px;min-height:44px}
.setform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.setform .btn{grid-column:1/-1}

/* 一覧 */
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.slot{font-size:14px;font-weight:700;color:var(--meal);margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:0 14px;min-height:38px;border-radius:999px}
.chip.on{background:var(--meal);border-color:var(--meal);color:var(--on)}
.frow{display:flex;width:100%;align-items:center;gap:8px;text-align:left;font:inherit;cursor:pointer;background:none;color:var(--ink);border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:52px}
.frow .fn{flex:1;min-width:0}
.frow .fs{font-size:12px;color:var(--muted);text-align:right}
.frow:active{background:var(--soft)}
details{margin-top:12px}
details>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";margin-right:8px;color:var(--muted)}
details[open]>summary::before{content:"▾"}
.dpanel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 14px 14px}

/* 評価 */
.lv{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;white-space:nowrap}
.lv.good{background:var(--good-bg);color:var(--good)} .lv.ok{background:var(--ok-bg);color:var(--ok)}
.lv.bad{background:var(--bad-bg);color:var(--bad)} .lv.na{background:var(--soft);color:var(--muted)}
.evr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.evr:first-of-type{border-top:0}
.evr .note{grid-column:1/-1;font-size:12px;color:var(--muted)}
.grade{display:flex;align-items:center;gap:12px}
.grade .g{font-size:44px;line-height:1;font-family:var(--numfont);font-weight:800}
.grade.good .g{color:var(--good)} .grade.ok .g{color:var(--ok)} .grade.bad .g{color:var(--bad)}
ul.adv{margin:10px 0 0;padding-left:1.2em;font-size:14px}
ul.adv li{margin:4px 0}
.gauge{margin:14px 0 4px}
.track{position:relative;height:14px;background:var(--soft);border-radius:7px;border:1px solid var(--line)}
.band{position:absolute;top:-1px;bottom:-1px;background:var(--good-bg);border:1px solid var(--good);border-radius:7px}
.mark{position:absolute;top:-7px;width:6px;height:26px;margin-left:-3px;background:var(--ink);border-radius:3px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.stackbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--soft);margin:8px 0 6px}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table.sum{width:100%;border-collapse:collapse;font-size:13px}
table.sum th,table.sum td{padding:7px 3px;border-top:1px solid var(--line);text-align:right;font-weight:400}
table.sum th:first-child,table.sum td:first-child{text-align:left}
table.sum thead th{border-top:0;color:var(--muted);font-size:12px}
.pos{color:var(--meal)} .neg{color:var(--car)}

/* チャート */
.chart{width:100%;height:auto;display:block}
.ax{font-size:10px;fill:var(--muted)}
.vl{font-size:10px;fill:var(--ink);text-anchor:middle}

/* シート */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--sa-b))}
.sheetbox h3{font-size:18px}

#toast{position:fixed;left:50%;bottom:calc(74px + var(--sa-b));transform:translateX(-50%) translateY(16px);max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;font-size:14px;z-index:40;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

const D=(date,create=false)=>{

function phaseAt(date){

/* ========== 計算 ========== */
const e1rm=(w,r)=>(r<=0||w<=0)?0:(r===1?w:w*(1+r/30));   // Epley式
const setsVol=sets=>sets.reduce((a,s)=>a+s.w*s.r,0);
function bodyWeightAt(date){
  if(!wkeys)wkeys=Object.keys(S.days).filter(k=>S.days[k].weight).sort();
  let w=S.settings.weight;
  for(const k of wkeys){if(k<=date)w=S.days[k].weight;else break}
  return w;
}
// 手入力がなければ「安静時を除いた上乗せ分」(MET-1)で推定
function cardioKcal(c,date){
  if(c.kcal)return c.kcal;
  return ((METS[c.type]||5)-1)*bodyWeightAt(date)*(c.min/60)*1.05;
}
function dayStats(date){
  const d=D(date),w=bodyWeightAt(date);
  const vol=d.strength.reduce((a,e)=>a+setsVol(e.sets),0);
  const nsets=d.strength.reduce((a,e)=>a+e.sets.length,0);
  const stMin=nsets>0?(d.stMin||nsets*STR_MIN_PER_SET):0;
  const stK=nsets>0?(STR_MET-1)*w*(stMin/60)*1.05:0;
  const cMin=d.cardio.reduce((a,c)=>a+(c.min||0),0);
  const cKcal=d.cardio.reduce((a,c)=>a+cardioKcal(c,date),0);
  const cKm=d.cardio.reduce((a,c)=>a+(c.km||0),0);
  const m=d.meals.reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c}),{kcal:0,p:0,f:0,c:0});
  return {vol,nsets,nex:d.strength.length,stMin,stK,cMin,cKcal,cKm,m,weight:d.weight,
          trained:nsets>0,cardio:cMin>0,meals:d.meals.length>0};
}
// 1日の消費・目標・収支
function dayCalc(date){
  const s=dayStats(date),w=bodyWeightAt(date),pr=S.profile;
  const bmr=10*w+6.25*pr.height-5*pr.age+(pr.sex==='m'?5:-161);
  const base=bmr*pr.act;
  const tdee=base+s.stK+s.cKcal;
  const ph=phaseAt(date),cfg=S.phaseCfg[ph];
  const tp=cfg.pg*w,tf=cfg.fg*w,tk=tdee+cfg.bal,tc=Math.max(0,(tk-tp*4-tf*9)/4);
  return {date,...s,w,bmr,base,tdee,ph,
    target:{kcal:tk,p:tp,f:tf,c:tc,bal:cfg.bal},logged:s.meals,
    balance:s.meals?s.m.kcal-tdee:null};
}
function periodRows(n,end=cur){return [...Array(n)].map((_,i)=>dayCalc(addDays(end,i-(n-1))))}
function aggregate(rows){
  const L=rows.filter(r=>r.logged);
  const avg=f=>L.length?L.reduce((a,r)=>a+f(r),0)/L.length:null;
  const sum=f=>rows.reduce((a,r)=>a+f(r),0);
  return {n:rows.length,nl:L.length,
    intake:avg(r=>r.m.kcal),tdee:avg(r=>r.tdee),base:avg(r=>r.base),st:avg(r=>r.stK),ca:avg(r=>r.cKcal),
    bal:avg(r=>r.balance),tbal:avg(r=>r.target.bal),tkcal:avg(r=>r.target.kcal),
    p:avg(r=>r.m.p),f:avg(r=>r.m.f),c:avg(r=>r.m.c),pt:avg(r=>r.target.p),ft:avg(r=>r.target.f),ct:avg(r=>r.target.c),
    trained:rows.filter(r=>r.trained).length,vol:sum(r=>r.vol),sets:sum(r=>r.nsets),
    cMin:sum(r=>r.cMin),cKcal:sum(r=>r.cKcal),cKm:sum(r=>r.cKm)};
}
function exHistory(name){
  const rows=[];
  Object.keys(S.days).sort().forEach(date=>{
    let best=null,vol=0,has=false;
    S.days[date].strength.forEach(e=>{
      if(e.name!==name)return;
      has=true;
      e.sets.forEach(s=>{
        vol+=s.w*s.r;
        const v=e1rm(s.w,s.r);
        if(!best||v>best.v||(v===best.v&&s.r>best.r))best={v,w:s.w,r:s.r};
      });
    });
    if(has&&best)rows.push({date,e1:best.v,w:best.w,r:best.r,vol});
  });
  return rows;
}
function isPR(name,date){
  const rows=exHistory(name),row=rows.find(r=>r.date===date);
  if(!row||row.e1<=0)return false;
  const prev=Math.max(0,...rows.filter(r=>r.date<date).map(r=>r.e1));
  return prev>0&&row.e1>prev;
}
function allPRs(){
  const names=new Set();
  Object.values(S.days).forEach(d=>d.strength.forEach(e=>names.add(e.name)));
  const out=[];
  names.forEach(name=>{
    let run=0;
    exHistory(name).forEach(r=>{
      if(run>0&&r.e1>run)out.push({name,date:r.date,e1:r.e1,w:r.w,r:r.r,prev:run});
      run=Math.max(run,r.e1);
    });
  });
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
function exNames(){
  const c={};
  Object.values(S.days).forEach(d=>d.strength.forEach(e=>{if(e.sets.length)c[e.name]=(c[e.name]||0)+1}));
  return Object.keys(c).sort((a,b)=>c[b]-c[a]);
}
function lastSession(name,before){
  const keys=Object.keys(S.days).filter(k=>k<before).sort().reverse();
  for(const k of keys){
    const sets=[];
    S.days[k].strength.forEach(e=>{if(e.name===name)sets.push(...e.sets)});
    if(sets.length)return {date:k,sets};
  }
  return null;
}
function streak(){
  const act=x=>{const t=dayStats(x);return t.trained||t.cardio};
  let d=today,n=0;
  if(!act(d))d=addDays(d,-1);
  while(act(d)){n++;d=addDays(d,-1)}
  return n;
}
function frequentMeals(){

}

function evaluate(rows,ag,prev){
  const n=ag.n,last=rows[rows.length-1],ph=last.ph,w=last.w;
  const items=[],advice=[];
  const add=(label,value,lvl,note='',w=1)=>items.push({label,value,lvl,note,w});
  const rr=ag.nl/n;

  add('食事の記録',`${ag.nl} / ${n}日`,n===1?(ag.nl?'good':'na'):rr>=.85?'good':rr>=.6?'ok':'bad',
      n===1?(ag.nl?'':'まだ記録がありません'):(rr<.85?'記録した日だけで平均を出しています':''));
  if(n>1&&rr<.6)advice.push('食事の記録が少ないため、平均値は参考程度です。まずは記録できる日を増やしましょう。');

  if(ag.nl>0){
    const diff=ag.bal-ag.tbal,ad=Math.abs(diff);
    const lvl=ad<=150?'good':ad<=300?'ok':'bad';
    add('カロリー収支',`${sg(ag.bal)} kcal/日`,lvl,`目標 ${sg(ag.tbal)} kcal/日（摂取−消費）${n===1?'　※1日の途中は参考値':''}`,3);
    if(lvl!=='good'){
      const riceG=round(ad/1.56/5)*5||5,walkMin=Math.round(ad/(2.5*w*1.05/60)/5)*5||5;
      if(diff>0){
        advice.push(ph==='bulk'
          ?`平均収支が目標より約${fmt(ad)}kcal/日 多めで、増量ペースが速めです。脂肪の増えすぎに注意し、ごはん約${riceG}g分を減らすのが目安です。`
          :`平均収支が目標より約${fmt(ad)}kcal/日 多めです。ごはん約${riceG}g分を減らすか、ウォーキング約${walkMin}分を足すのが目安です。`);
      }else{
        advice.push(ph==='cut'
          ?`平均収支が目標より約${fmt(ad)}kcal/日 少なく、減量ペースが速めです。筋量が落ちやすい水準なので、ごはん約${riceG}g分を足すなど少し増やしましょう。`
          :`平均収支が目標より約${fmt(ad)}kcal/日 少ないです。ごはん約${riceG}g分を足すのが目安です。`);
      }
    }
    const pr=ag.p/ag.pt;
    add('たんぱく質',`${fmt(ag.p)} / ${fmt(ag.pt)} g`,pr>=.95?'good':pr>=.8?'ok':'bad',`体重×${S.phaseCfg[ph].pg}g が目標`);
    if(pr<.95){
      const gap=ag.pt-ag.p;
      advice.push(`たんぱく質が平均${fmt(gap)}g不足です。鶏むね肉(皮なし)約${Math.round(gap/0.233/10)*10||10}g、またはプロテイン${Math.ceil(gap/21)}杯で補えます。`);
    }
  }else{
    add('カロリー収支','–','na','食事を記録すると評価できます');
  }

  if(n===1){
    add('筋トレ',last.trained?`${last.nex}種目 ${last.nsets}セット / ${fmt(last.vol)}kg`:'休養日',last.trained?'good':'na');
    add('有酸素',last.cMin?`${fmt(last.cMin)}分`:'なし',last.cMin?'good':'na');
  }else{
    const tt=S.settings.trainDays*n/7,tr=ag.trained/tt;
    add('筋トレの日数',`${ag.trained}日 / 目標${round(tt,1)}日`,tr>=.9?'good':tr>=.6?'ok':'bad');
    if(tr<.9)advice.push(`筋トレ日数が目標を下回っています（${ag.trained}日／${round(tt,1)}日）。予定を決めて固定すると続けやすくなります。`);
    if(prev&&prev.vol>0&&ag.vol>0){
      const ch=(ag.vol/prev.vol-1)*100;
      add('ボリューム（前の同期間比）',`${sg(ch)}%`,ch>=0?'good':ch>=-10?'ok':'bad',`${fmt(ag.vol)}kg（前期間 ${fmt(prev.vol)}kg）`);
    }
    const ct=S.settings.cardioMin*n/7,cr=ag.cMin/ct;
    add('有酸素の時間',`${fmt(ag.cMin)}分 / 目標${fmt(ct)}分`,cr>=.9?'good':cr>=.6?'ok':'bad');
    if(cr<.6&&ph==='cut')advice.push('有酸素が目標の6割未満です。ウォーキングでも消費を積み上げられます。');
  }

  if(n>=7){
    const wr=rows.filter(r=>r.weight);
    const f=wr[0],l=wr[wr.length-1],span=wr.length>=2?daysBetween(f.date,l.date):0;
    if(wr.length>=2&&span>=4){
      const delta=l.weight-f.weight,rate=delta/f.weight*100/(span/7),[lo,hi]=RATE[ph];
      const inR=rate>=lo&&rate<=hi;
      add('体重の変化',`${sg(delta,1)} kg（週${sg(rate,2)}%）`,inR?'good':'ok',`${PHASES[ph]}の目安：週${sg(lo,2)}〜${sg(hi,2)}%`);
      if(!inR){
        advice.push(ph==='cut'?(rate>hi?'体重の減りが緩やかです。収支が目標どおりなら、2週間ほど続けて様子を見ましょう。':'体重の減りが速めです。筋量維持のため、摂取を少し増やすことを検討しましょう。')
          :ph==='bulk'?(rate<lo?'体重の増えが小さめです。摂取を少し増やしてみましょう。':'体重の増えが速めです。脂肪が増えすぎていないか注意しましょう。')
          :'体重の変動が維持の範囲を超えています。');
      }
    }else add('体重の変化','–','na','体重を4日以上あけて2回以上記録すると評価できます');
    if(ag.nl>0)add('理論上の体重変化',`${sg(ag.bal*n/7200,1)} kg`,'na','平均収支×日数÷7,200kcal（体脂肪1kg相当）');
  }

  const sc=items.filter(i=>i.lvl!=='na');
  const wsum=sc.reduce((a,i)=>a+i.w*2,0);
  const ratio=sc.length?sc.reduce((a,i)=>a+i.w*(i.lvl==='good'?2:i.lvl==='ok'?1:0),0)/wsum:null;
  let grade=null;
  if(ratio!=null){
    grade=ratio>=.85?{g:'A',t:'順調です',l:'good'}:ratio>=.65?{g:'B',t:'おおむね良好です',l:'good'}:ratio>=.4?{g:'C',t:'調整が必要です',l:'ok'}:{g:'D',t:'見直しましょう',l:'bad'};
    const bi=items.find(i=>i.label==='カロリー収支');
    if(bi&&bi.lvl==='bad'&&(grade.g==='A'||grade.g==='B'))grade={g:'C',t:'収支の調整が必要です',l:'ok'};
  }
  return {items,advice,grade};
}

function niceMax(m){
  const p=10**Math.floor(Math.log10(m)),f=m/p;
  return [1,1.5,2,2.5,3,4,5,6,8,10].find(x=>x>=f)*p;
}
function xLabels(labels,x,y){
  const n=labels.length,k=Math.ceil(n/6);
  return labels.map((l,i)=>((n-1-i)%k===0)?`<text x="${x(i)}" y="${y}" text-anchor="middle" class="ax">${l}</text>`:'').join('');
}
function barChart({vals,labels,color,target,unit='',title=''}){
  const n=vals.length,W=360,H=170,L=38,R=6,T=14,B=22,iw=W-L-R,ih=H-T-B;
  const mx=niceMax(Math.max(target||0,...vals.filter(v=>v!=null),1)*1.05);
  const y=v=>T+ih-(v/mx)*ih,bw=iw/n;
  let g='';
  [0,.5,1].forEach(t=>{const v=mx*t;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L-5}" y="${y(v)+3.5}" text-anchor="end" class="ax">${fmt(v)}</text>`});
  vals.forEach((v,i)=>{
    if(v==null||v<=0)return;
    const x=L+i*bw+bw*.15,w=bw*.7;
    g+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${T+ih-y(v)}" rx="1.5" style="fill:var(--${color})"><title>${labels[i]}：${fmt(v)}${unit}</title></rect>`;
    if(n<=8)g+=`<text x="${x+w/2}" y="${y(v)-3}" class="vl">${fmt(v)}</text>`;
  });
  if(target)g+=`<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke-dasharray="5 4" style="stroke:var(--ink)"/><text x="${W-R}" y="${y(target)-3}" text-anchor="end" class="ax">目標 ${fmt(target)}</text>`;
  g+=xLabels(labels,i=>L+i*bw+bw/2,H-5);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>`;
}
function divChart({vals,labels,target,title=''}){
  const n=vals.length,W=360,H=170,L=38,R=6,T=10,B=22,iw=W-L-R,ih=H-T-B;
  const nums=vals.filter(v=>v!=null);
  const mx=niceMax(Math.max(Math.abs(target||0),...nums.map(Math.abs),100)*1.1);
  const y=v=>T+ih/2-(v/mx)*(ih/2),bw=iw/n;
  let g='';
  [-1,0,1].forEach(t=>{const v=mx*t;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L-5}" y="${y(v)+3.5}" text-anchor="end" class="ax">${sg(v)}</text>`});
  vals.forEach((v,i)=>{
    if(v==null)return;
    const x=L+i*bw+bw*.15,w=bw*.7,y0=y(0),y1=y(v);
    g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${w}" height="${Math.max(Math.abs(y1-y0),1)}" rx="1.5" style="fill:var(--${v>=0?'meal':'car'})"><title>${labels[i]}：${sg(v)} kcal</title></rect>`;
  });
  if(target!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke-dasharray="5 4" style="stroke:var(--ink)"/><text x="${W-R}" y="${y(target)-3}" text-anchor="end" class="ax">目標 ${sg(target)}</text>`;
  g+=xLabels(labels,i=>L+i*bw+bw/2,H-5);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>`;
}
function lineChart({vals,labels,color,unit='',dec=1,title=''}){
  const pts=vals.map((v,i)=>v==null?null:[i,v]).filter(Boolean);
  if(pts.length<2)return `<p class="empty">2回以上の記録があるとグラフが表示されます。</p>`;
  const n=vals.length,W=360,H=170,L=38,R=10,T=12,B=22,iw=W-L-R,ih=H-T-B;
  const ys=pts.map(p=>p[1]);
  let mn=Math.min(...ys),mx=Math.max(...ys);
  const span=(mx-mn)||Math.max(mx*.05,1);
  mn-=span*.15;mx+=span*.15;
  const x=i=>L+(n===1?0:i/(n-1)*iw),y=v=>T+ih-((v-mn)/(mx-mn))*ih;
  let g='';
  [0,.5,1].forEach(t=>{const v=mn+(mx-mn)*t;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L-5}" y="${y(v)+3.5}" text-anchor="end" class="ax">${fmt(v,dec)}</text>`});
  g+=`<polyline fill="none" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>`${x(p[0])},${y(p[1])}`).join(' ')}" style="stroke:var(--${color})"/>`;
  if(pts.length<=40)pts.forEach(p=>{g+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.5" style="fill:var(--${color})"><title>${labels[p[0]]}：${fmt(p[1],dec)}${unit}</title></circle>`});
  g+=xLabels(labels,x,H-5);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>`;
}
const bar=(v,t,c)=>`<div class="bar"><i style="--c:var(${c});width:${pct(v,t)}%"></i></div>`;
const seg=(opts,active,act,extra='')=>`<div class="seg ${extra}" role="group">${opts.map(([k,l])=>`<button class="${k==active?'on':''}" data-act="${act}" data-v="${k}">${l}</button>`).join('')}</div>`;
const lv=l=>`<span class="lv ${l}">${{good:'良好',ok:'注意',bad:'要改善',na:'–'}[l]}</span>`;

/* ========== 画面：サマリー ========== */

  const P=v=>Math.max(0,Math.min(100,(v+1000)/2000*100));
  return `<div class="gauge"><div class="track"><div class="band" style="left:${P(tbal-150)}%;width:${P(tbal+150)-P(tbal-150)}%"></div><div class="mark" style="left:${P(bal)}%"></div></div>
    <div class="ticks"><span>−1,000</span><span>0</span><span>+1,000 kcal</span></div></div>`;
}

  let tbl='';

      </tbody></table>
      <p class="sub" style="margin-top:6px">${n===7?'':'週別は記録した日の平均です。'}収支がプラスなら余剰、マイナスなら不足です。</p></section>`;

/* ========== 画面：筋トレ ========== */
function stepper(name,step,val,mode,label){
  return `<label class="f">${label}<div class="stp"><button class="sb" data-act="step" data-d="${-step}" aria-label="${label}を減らす">−</button><input type="number" name="${name}" step="${step}" min="0" inputmode="${mode}" value="${val}"><button class="sb" data-act="step" data-d="${step}" aria-label="${label}を増やす">＋</button></div></label>`;
}
function viewStrength(){
  const d=D(cur),s=dayStats(cur);

      <ol class="sets">${e.sets.map((x,i)=>`<li><span class="idx">${i+1}</span><span>${setLabel(x)}</span><span class="sub num">${x.w?`1RM ${fmt(e1rm(x.w,x.r),1)}`:''}</span><button class="x" data-act="delSet" data-ex="${e.id}" data-i="${i}" aria-label="${i+1}セット目を削除">×</button></li>`).join('')}</ol>

}

/* ========== 画面：食事 ========== */
function foodListHtml(){
  const q=foodQ.trim().toLowerCase();
  const freq=frequentMeals();
  let out='';
  if(q){
    const list=allFoods().filter(f=>f.n.toLowerCase().includes(q)).slice(0,40);
    const fr=freq.filter(m=>m.name.toLowerCase().includes(q)).slice(0,5);
    out+=fr.map((m,i)=>freqRow(m)).join('');
    out+=list.map(foodRow).join('');
    if(!out)out='<p class="empty">見つかりません。「手入力」か「マイ食品」から追加できます。</p>';
    return out;
  }
  if(foodCat==='よく使う'){
    return freq.length?freq.map(freqRow).join(''):'<p class="empty">記録した食事がここに並び、タップで同じものを追加できます。</p>';
  }
  const list=allFoods().filter(f=>f.cat===foodCat);
  return list.length?list.map(foodRow).join(''):'<p class="empty">まだ登録がありません。下の「マイ食品」から登録できます。</p>';
}
function foodRow(f){
  const basis=f.unit?`${f.unit}あたり`:'100gあたり';
  return `<button class="frow" data-act="openFood" data-id="${f.id}"><span class="fn">${esc(f.n)}</span><span class="fs num">${basis}<br>${fmt(f.k)}kcal　P ${fmt(f.p,1)}</span></button>`;
}
function freqRow(m){
  const i=frequentMeals().findIndex(x=>x.name===m.name);

}

const pickFactor=()=>pick.f.unit?pick.amt:pick.amt/100;
function pickCalc(){
  const k=pickFactor(),f=pick.f;
  return {kcal:f.k*k,p:f.p*k,f:f.f*k,c:f.c*k};
}
function renderSheet(){

}

/* ========== 操作 ========== */
let toastTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2200)}
function armed(key){
  if(armedKey===key){armedKey=null;return true}
  armedKey=key;
  setTimeout(()=>{if(armedKey===key){armedKey=null;render()}},3000);
  return false;
}
const fval=(f,n)=>{const e=f.querySelector(`[name="${n}"]`);return e?e.value:''};
const findEx=id=>D(cur).strength.find(e=>e.id===id);
const pushMeal=(m)=>{D(cur,true).meals.push({id:uid(),slot:mealSlot,...m})};

const acts={
  prev(){cur=addDays(cur,-1)},
  next(){cur=addDays(cur,1)},
  today(){cur=today},
  tab(el){tab=el.dataset.t;window.scrollTo(0,0)},
  range(el){range=+el.dataset.v},
  phase(el){
    const ph=el.dataset.v;
    S.phases=S.phases.filter(x=>x.from<cur);
    if(phaseAt(addDays(cur,-1))!==ph||!S.phases.length)S.phases.push({from:cur,phase:ph});
    toast(`${PHASES[ph]}に切り替えました`);
  },
  slot(el){mealSlot=el.dataset.v},
  step(el){
    const inp=el.parentElement.querySelector('input');
    let v=(num(inp.value)||0)+(+el.dataset.d);
    if(v<0)v=0;
    inp.value=round(v,2);
    inp.dispatchEvent(new Event('input',{bubbles:true}));
    return false;
  },
  saveWeight(el){
    const w=num(fval(el.closest('[data-form]'),'weight'));
    D(cur,true).weight=w&&w>0?w:null;toast(w?'体重を保存しました':'体重の記録を消しました');
  },
  addEx(el){
    const name=fval(el.closest('[data-form]'),'name').trim();
    if(!name){toast('種目名を入力してください');return false}
    const id=uid();D(cur,true).strength.push({id,name,sets:[]});
    focusAfter={sel:`.form[data-ex="${id}"] [name=weight]`};
  },
  delEx(el){const d=D(cur,true);d.strength=d.strength.filter(e=>e.id!==el.dataset.id)},
  addSet(el){
    const f=el.closest('.form');const w=num(fval(f,'weight')),r=num(fval(f,'reps'));
    if(w==null||w<0||!r||r<1){toast('重量（0以上）と回数（1以上）を入力してください');return false}
    findEx(el.dataset.ex).sets.push({w,r:Math.round(r)});
    toast('セットを追加しました');
  },
  delSet(el){findEx(el.dataset.ex).sets.splice(+el.dataset.i,1)},
  saveRoutine(el){
    const f=el.closest('[data-form]');
    const name=fval(f,'rname').trim(),items=fval(f,'items').split('\n').map(x=>x.trim()).filter(Boolean);
    if(!name||!items.length){toast('メニュー名と種目を入力してください');return false}
    S.routines.push({id:uid(),name,items});toast('メニューを保存しました');
  },
  fillRoutine(el){
    const f=el.closest('[data-form]');
    const names=D(cur).strength.map(e=>e.name);
    if(!names.length){toast('この日の種目がありません');return false}
    f.querySelector('[name=items]').value=names.join('\n');return false;
  },
  loadRoutine(el){
    const r=S.routines.find(x=>x.id===el.dataset.id);if(!r)return false;
    const d=D(cur,true),have=new Set(d.strength.map(e=>e.name));let n=0;
    r.items.forEach(name=>{if(!have.has(name)){d.strength.push({id:uid(),name,sets:[]});n++}});
    toast(`${n}種目を読み込みました`);
  },
  delRoutine(el){if(armed('r'+el.dataset.id))S.routines=S.routines.filter(r=>r.id!==el.dataset.id)},
  addCardio(el){
    const f=el.closest('[data-form]');const min=num(fval(f,'min'));
    if(!min||min<=0){toast('時間（分）を入力してください');return false}
    D(cur,true).cardio.push({id:uid(),type:fval(f,'type'),min,km:num(fval(f,'km'))||0,kcal:num(fval(f,'kcal'))||null});
    toast('有酸素を記録しました');
  },
  delCardio(el){const d=D(cur,true);d.cardio=d.cardio.filter(c=>c.id!==el.dataset.id)},
  foodCat(el){foodCat=el.dataset.v;foodQ=''},
  openFood(el){
    const f=foodById(el.dataset.id);if(!f)return false;
    pick={f,amt:f.unit?1:(f.ports&&f.ports[0]?f.ports[0][1]:100)};
    renderSheet();return false;
  },
  closeSheet(){pick=null;renderSheet();return false},
  portion(el){
    pick.amt=+el.dataset.g;$('#amt').value=pick.amt;updateCalc();return false;
  },
  addFood(){
    if(!pick||!(pick.amt>0)){toast('量を入力してください');return false}
    const c=pickCalc(),f=pick.f;
    const label=f.unit?(pick.amt===1?f.n:`${f.n} ×${pick.amt}`):`${f.n} ${pick.amt}g`;
    pushMeal({name:label,kcal:round(c.kcal),p:round(c.p,1),f:round(c.f,1),c:round(c.c,1),fid:f.id});
    pick=null;renderSheet();toast(`${mealSlot}に追加：${label}`);
  },
  repeatMeal(el){
    const m=frequentMeals()[+el.dataset.i];if(!m)return false;
    pushMeal({name:m.name,kcal:m.kcal,p:m.p,f:m.f,c:m.c,fid:m.fid});
    toast(`${mealSlot}に追加：${m.name}`);
  },
  addMeal(el){
    const f=el.closest('[data-form]');
    const p=num(fval(f,'p'))||0,fa=num(fval(f,'f'))||0,c=num(fval(f,'c'))||0;
    let kcal=num(fval(f,'kcal'));
    if(kcal==null&&(p||fa||c))kcal=round(p*4+fa*9+c*4);
    if(kcal==null){toast('kcal か PFC のどれかを入力してください');return false}
    pushMeal({name:fval(f,'name').trim()||mealSlot,kcal,p,f:fa,c});
    toast('食事を記録しました');
  },
  delMeal(el){const d=D(cur,true);d.meals=d.meals.filter(m=>m.id!==el.dataset.id)},
  addCustom(el){
    const f=el.closest('[data-form]');
    const n=fval(f,'name').trim(),p=num(fval(f,'p'))||0,fa=num(fval(f,'f'))||0,c=num(fval(f,'c'))||0;
    let k=num(fval(f,'kcal'));
    if(k==null&&(p||fa||c))k=round(p*4+fa*9+c*4);
    if(!n||k==null){toast('食品名と、kcal（またはPFC）を入力してください');return false}
    const each=fval(f,'basis')==='each';
    S.customFoods.push({id:uid(),n,k,p,f:fa,c,each,unit:'1食'});
    foodCat='マイ食品';toast('マイ食品に登録しました');
  },
  delCustom(el){if(armed('f'+el.dataset.id))S.customFoods=S.customFoods.filter(x=>x.id!==el.dataset.id)},
  saveProfile(el){
    const f=el.closest('[data-form]');
    const g=n=>num(fval(f,n));
    S.profile.sex=fval(f,'sex');
    if(g('age')>0)S.profile.age=g('age');
    if(g('height')>0)S.profile.height=g('height');
    S.profile.act=g('act')||1.2;
    ['trainDays','cardioMin','weight'].forEach(k=>{if(g(k)>0)S.settings[k]=g(k)});
    toast('保存しました');
  },
  savePhaseCfg(el){
    const f=el.closest('[data-form]');
    Object.keys(PHASES).forEach(k=>{
      const b=num(fval(f,k+'_bal')),p=num(fval(f,k+'_pg')),fg=num(fval(f,k+'_fg'));
      if(b!=null)S.phaseCfg[k].bal=b;
      if(p>0)S.phaseCfg[k].pg=p;
      if(fg>0)S.phaseCfg[k].fg=fg;
    });
    toast('保存しました');
  },
  download(){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`trekiroku-${today}.json`;
    document.body.appendChild(a);a.click();a.remove();toast('保存を開始しました');return false;
  },
  copyExport(){
    const t=$('#exp');t.select();t.setSelectionRange(0,t.value.length);
    try{document.execCommand('copy');toast('コピーしました')}catch(e){toast('選択済みです。手動でコピーしてください')}
    return false;
  },
  doImport(){
    try{
      const d=JSON.parse($('#imp').value);
      if(!d||typeof d.days!=='object')throw new Error('形式が違います');
      S=normalize(d);toast('読み込みました');
    }catch(e){toast('読み込めませんでした。データの形式を確認してください');return false}
  },
  resetAll(){if(armed('reset')){S=newState();toast('全データを削除しました')}}
};

document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('sheetbg')){pick=null;renderSheet();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=acts[el.dataset.act];if(!a)return;
  const r=a(el);
  if(r!==false){save();render()}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]');if(!el)return;
  const k=el.dataset.change;
  if(k==='date'&&el.value){cur=el.value;render()}
  else if(k==='chartEx'){chartEx=el.value;render()}
  else if(k==='stMin'){D(cur,true).stMin=num(el.value)>0?num(el.value):null;save();render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fq'){foodQ=t.value;const l=$('#foodList');if(l)l.innerHTML=foodListHtml();
    document.querySelectorAll('.chip.on').forEach(c=>{if(foodQ)c.classList.remove('on')})}
  else if(t.id==='amt'&&pick){pick.amt=num(t.value)||0;updateCalc()}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.type==='search')return;
  const f=e.target.closest('.form,[data-form],.sheetbox');if(!f)return;
  const b=f.querySelector('.btn.go');if(b){e.preventDefault();b.click()}
});

(async()=>{
  const d=await loadData();
  if(d)S=normalize(d);
  render();
})();
</script>
</body>
</html>
